<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Quote</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<style>
  :root {
    --ink:#1a1a1a; --steel:#3d4a5c; --mist:#7d8894; --rule:#dde1e6; --bg:#f4f3f1;
    --card:#fff; --accent:#c8501a; --accent-d:#a8410f; --accent-l:#fdf0eb; --ok:#2f7d4f; --bad:#b3261e;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--ink)}
  [hidden]{display:none!important}

  /* header */
  .bar{position:sticky;top:0;z-index:20;background:var(--steel);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:3px solid var(--accent)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap;min-width:0;overflow:hidden}
  .brand img{height:30px;max-width:90px;object-fit:contain;background:#fff;border-radius:5px;padding:2px 4px}
  .brand .nm{overflow:hidden;text-overflow:ellipsis}
  .bar nav{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
  .bar button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:6px;padding:7px 12px;font-size:14px;white-space:nowrap}
  .bar button.on{background:rgba(255,255,255,.25)}
  .bar button.primary{background:var(--accent);border-color:var(--accent)}

  /* layout + forms */
  main{max-width:860px;margin:0 auto;padding:14px 12px 130px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:12px}
  .jump{position:sticky;top:51px;z-index:12;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:-4px -2px 8px;background:var(--bg);scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jump button{flex:0 0 auto;border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;color:var(--steel);white-space:nowrap}
  .jump button:hover{border-color:var(--accent);color:var(--accent)}
  #app .card[id]{scroll-margin-top:112px}
  .card h2{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:10px}
  .doctitle{display:flex;align-items:center;gap:10px;margin:2px 2px 12px;flex-wrap:wrap}
  .doctitle h1{font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .doctitle .num{font-family:var(--mono);color:var(--steel);font-size:14px}
  .link{background:none;border:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid1{display:grid;grid-template-columns:1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1.4fr 1fr .8fr 1fr;gap:10px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:.05em}
  label.f input,label.f select,label.f textarea{font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;border:1px solid var(--rule);border-radius:6px;padding:8px 9px;background:#fff;width:100%}
  div.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:.05em}
  input:disabled{background:#f3f4f6!important;color:var(--mist)}
  label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
  label.chk input{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)!important;background:var(--accent-l)!important}
  textarea{resize:vertical}
  .note{font-size:12px;color:var(--mist);line-height:1.5;margin-top:6px}
  .banner{background:#fff7e0;border:1px solid #f0dc9c;color:#6b5410;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
  .banner.void{background:#f6e7e6;border-color:#e5b9b5;color:#7a221b;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* line items */
  .line{border:1px solid var(--rule);border-radius:8px;padding:10px;margin-bottom:8px;background:#fcfcfb}
  .line textarea.desc{width:100%;border:1px solid var(--rule);border-radius:6px;padding:8px 9px;background:#fff;font-size:15px;resize:none;overflow:hidden;min-height:38px;line-height:1.35}
  .lrow{display:grid;grid-template-columns:80px 110px 1fr;gap:8px;align-items:end;margin-top:8px}
  .lrow label,.prow label,.panel label,.iparams label{display:flex;flex-direction:column;gap:2px;font-size:10px;font-weight:600;color:var(--mist);text-transform:uppercase;letter-spacing:.05em}
  .lrow input{border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-family:var(--mono);font-size:15px;text-align:right;width:100%;background:#fff}
  .amt{font-family:var(--mono);text-align:right;font-size:15px;padding:8px 2px;color:var(--steel)}
  .ltools{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .tbtn{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--steel);white-space:nowrap}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d);font-weight:600}
  .tbtn.del{margin-left:auto;color:var(--mist)}
  .tbtn.del:hover{color:var(--bad);border-color:var(--bad)}
  .panel{margin-top:8px;padding:9px;border-radius:6px;display:grid;gap:8px}
  .panel input{border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-size:15px;width:100%;background:#fff}
  .panel .res{grid-column:1/-1;font-size:13px;font-family:var(--mono)}
  .timep{background:var(--accent-l);grid-template-columns:repeat(3,1fr)}
  .timep label,.timep .res{color:var(--accent-d)}
  .timep input{font-family:var(--mono);text-align:right}
  .adjp{background:#f1f4f7;grid-template-columns:110px 1fr}
  .adjp label,.adjp .res{color:var(--steel)}
  .adjp .adjin{font-family:var(--mono);text-align:right}
  .ibtn{height:36px;border:1px solid var(--rule);background:#fff;border-radius:6px;color:var(--mist);font-size:16px;line-height:1}
  .ibtn:hover{border-color:var(--accent);color:var(--accent)}
  .addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
  .addrow select{border:1.5px solid var(--accent);border-radius:8px;padding:10px;background:var(--accent-l);color:var(--accent-d);font-size:14px;font-weight:600;width:100%}
  .tbtn.mv{padding:5px 9px}
  .warn{color:var(--bad)!important;font-weight:600}
  .linkbtn{background:none;border:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:0;margin-top:2px;text-align:left}
  .addline{width:100%;border:1.5px dashed var(--rule);background:none;border-radius:8px;padding:10px 14px;color:var(--mist);font-size:14px}
  .addrow .addline{width:auto}
  .addline:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}

  /* totals + tax */
  .tot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.tot{grid-template-columns:1fr}}
  .adj{display:flex;flex-direction:column;gap:9px}
  .pair{display:flex;gap:6px}
  .pair input{flex:1}
  .pair select{width:70px!important}
  .taxbox{border-top:1px solid var(--rule);padding-top:10px}
  .txrow{display:grid;grid-template-columns:1fr 70px 14px 34px;gap:6px;align-items:center;margin-top:6px}
  .txrow input{border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-size:14px;width:100%;background:#fff}
  .txrow .txrate{font-family:var(--mono);text-align:right}
  .txrow .ibtn{height:33px}
  .sum div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .sum div span:first-child{color:var(--mist)}
  .sum div span:last-child{font-family:var(--mono);white-space:nowrap}
  .sum .grand{border:none;margin-top:8px;background:var(--ink);color:#fff;border-radius:7px;padding:11px 12px;font-weight:700}
  .sum .grand span:first-child{color:#fff;letter-spacing:.08em;text-transform:uppercase;font-size:13px;align-self:center}
  .sum .grand span:last-child{font-size:20px}
  .sum .incl{border:none;font-size:12.5px}
  .sum .bal{border:none;margin-top:6px;background:var(--accent);color:#fff;border-radius:7px;padding:10px 12px;font-weight:700}
  .sum .bal span:first-child{color:#fff;letter-spacing:.08em;text-transform:uppercase;font-size:12px;align-self:center}
  .sum .bal.paid{background:var(--ok)}

  /* payments */
  .prow{display:grid;grid-template-columns:1.2fr 1.3fr 1fr 40px;gap:8px;align-items:end;margin-bottom:8px}
  @media (max-width:480px){.prow{grid-template-columns:1fr 1fr 40px}.prow label:first-child{grid-column:1/-1}}
  .prow input,.prow select{border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-size:15px;width:100%;background:#fff}
  .prow input.pamt{font-family:var(--mono);text-align:right}
  .paysum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin:4px 0 10px;padding:9px 11px;border-radius:7px;background:#f3f5f7}
  .paysum b{font-family:var(--mono)}

  /* bottom actions */
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);border-top:1px solid var(--rule);padding:10px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:7px;padding:9px 14px;font-size:14px;white-space:nowrap}
  .btn:hover{border-color:var(--steel)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent-d)}
  .btn.dark{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600}
  .btn.danger{color:var(--bad)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .savestate{font-size:12px;color:var(--mist);align-self:center;min-width:60px;text-align:center}

  /* list */
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;color:var(--steel)}
  .tabs button.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .owed{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:10px 13px;margin-bottom:10px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .owed b{font-family:var(--mono)}
  .search{width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff;margin-bottom:10px}
  .qitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;border:1px solid var(--rule);border-radius:9px;padding:11px 13px;margin-bottom:7px;cursor:pointer}
  .qitem:hover{border-color:var(--accent)}
  .qitem .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qitem .money{font-family:var(--mono);text-align:right;font-weight:600}
  .qitem .meta{font-size:12px;color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qitem .right{text-align:right;white-space:nowrap}
  .qitem.void .who,.qitem.void .money{text-decoration:line-through;color:var(--mist)}
  .type{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mist);margin-right:6px}
  .chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:#eef0f3;color:var(--steel)}
  .chip.Sent{background:#e6eefb;color:#2456a6}.chip.Accepted,.chip.Paid{background:#e3f3ea;color:var(--ok)}
  .chip.Declined,.chip.Overdue,.chip.Void{background:#f6e7e6;color:#9a2d24}.chip.Invoiced{background:#efe9f8;color:#5b3d93}
  .chip.Unpaid{background:#fff1dd;color:#8a5300}.chip.Partial{background:#fff7d6;color:#7a6200}.chip.Expired{background:#eceff2;color:#6b7580}.chip.Issued{background:#eef3fb;color:#2f4f7a}
  .start{max-width:720px;margin:6px auto 0}
  .hero{background:linear-gradient(135deg,var(--accent-l),#fff 70%);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:14px;padding:22px 20px;margin-bottom:14px}
  .hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .hero h1{font-size:25px;line-height:1.2;margin:6px 0 8px;color:var(--ink);letter-spacing:-.01em}
  .hero p{font-size:15.5px;color:var(--steel);line-height:1.5}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  @media (max-width:640px){.steps{grid-template-columns:1fr}.hero h1{font-size:22px}}
  .step{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
  .step:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
  .step .sn{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .stag{display:inline-block;vertical-align:2px;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:#eef1f4;color:var(--steel)}
  .step .sb{display:flex;flex-direction:column;gap:4px}
  .step .stt{font-size:16px;font-weight:700;color:var(--ink)}
  .step .std{font-size:13.5px;color:var(--steel);line-height:1.45}
  .step .sgo{font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}
  .bigbtn{display:block;width:100%;padding:15px;font-size:17px;border-radius:10px;margin-bottom:8px}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .quick .btn{padding:16px 10px;font-size:17px;border-radius:10px;margin:0}
  .empty{text-align:center;color:var(--mist);padding:50px 10px;line-height:1.6}

  /* settings */
  .logo-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo-prev{width:160px;height:84px;border:1.5px dashed var(--rule);border-radius:7px;display:flex;align-items:center;justify-content:center;background:#fafafa;color:var(--mist);font-size:12px;overflow:hidden}
  .logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--rule)}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .swatches input[type=color]{width:40px;height:34px;border:1px solid var(--rule);border-radius:6px;padding:2px;background:#fff}
  .snp{background:#f3f7f5;border:1px solid #d5e6dc;border-radius:7px;padding:8px 11px;color:var(--steel)!important;font-size:12.5px!important}
  .snp a{color:var(--accent);font-weight:600}
  .qrprev{width:96px;height:96px;border:1px solid var(--rule);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:11px;text-align:center;background:#fff;flex-shrink:0}
  .item,.loc{border:1px solid var(--rule);border-radius:8px;padding:10px;margin-bottom:8px;background:#fcfcfb}
  .ihead{display:grid;grid-template-columns:1fr 190px 40px;gap:8px}
  @media (max-width:560px){.ihead{grid-template-columns:1fr 40px}.ihead .itype{grid-column:1/-1;grid-row:2}}
  .item input,.item select,.item textarea,.loc .lname{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;background:#fff;font-size:14px;width:100%}
  .item .iname,.loc .lname{font-weight:600}
  .item textarea{margin-top:8px;resize:vertical}
  .iparams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;align-items:end}
  .iparams .inote{grid-column:1/-1;font-size:12px;color:var(--mist)}
  .exgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:560px){.exgrid{grid-template-columns:1fr 1fr}}
  .lhead{display:grid;grid-template-columns:1fr auto 40px;gap:8px;align-items:center}
  .lfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}

  details.help{border:1px solid var(--rule);border-radius:8px;background:#f7f9fb;margin:4px 0 12px;font-size:13.5px;line-height:1.5}
  details.help summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--steel);list-style:none}
  details.help summary::-webkit-details-marker{display:none}
  details.help summary::before{content:'▸ ';color:var(--accent)}
  details.help[open] summary::before{content:'▾ '}
  details.help .hb{padding:0 14px 12px}
  details.help ol{margin:4px 0 8px 18px}
  details.help li{margin:5px 0}
  details.help table{border-collapse:collapse;margin:6px 0 4px;font-size:12.5px;width:100%;max-width:440px}
  details.help td,details.help th{border:1px solid var(--rule);padding:4px 7px;text-align:left;background:#fff}
  details.help th{background:#eef1f4;font-weight:600}
  details.help td.r{text-align:right;font-family:var(--mono)}
  details.help .ex{font-size:11.5px;color:var(--mist);font-style:italic}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
  #toast.act{pointer-events:auto}
  #toast button{background:none;border:none;color:#ffb38a;font-weight:700;margin-left:10px;padding:0 2px;text-decoration:underline}
  #toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal .box{background:#fff;border-radius:12px;padding:20px;max-width:380px;width:100%}
  .modal p{margin-bottom:16px;line-height:1.45;white-space:pre-line}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .loading{text-align:center;color:var(--mist);padding:60px 0}
  @media (max-width:480px){.brand .nm{display:none}.bar{padding:8px 10px}.bar button{padding:7px 10px}.actions{gap:6px;padding:8px}.actions .btn{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand"><span class="nm">Quick Quote</span></div>
  <nav>
    <button id="navList">All</button>
    <button id="navSettings">Settings</button>
    <button id="navNew" class="primary">+ New</button>
  </nav>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div id="actions"></div>
<div id="toast"></div>
<div class="modal" id="modal" hidden><div class="box"><p id="modalMsg"></p><div class="row" id="modalRow"></div></div></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  Quick Quote — quotes, invoices and payments for small makers.
//  One page. Data lives in the owner's Claude account (db capability),
//  or in this browser if that isn't available.
// ═══════════════════════════════════════════════════════════════

// ───────── helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

  try { await store.saveSettings(next); settings = next; settingsDirty = false; applyTheme(); return true; }
  catch (e) { toast('Could not save settings — try again.'); return false; }
}

function timeText(l) {

function wireLine(node) {
  const d = current, l = d.lines.find(x => x.id === node.dataset.id); if (!l) return;
  const desc = node.querySelector('.desc');
  const grow = () => { desc.style.height = 'auto'; desc.style.height = desc.scrollHeight + 'px'; };
  requestAnimationFrame(grow);
  desc.oninput = () => { l.desc = desc.value; grow(); scheduleSave(); };
  const move = dir => {
    const i = d.lines.indexOf(l), j = i + dir; if (j < 0 || j >= d.lines.length) return;
    [d.lines[i], d.lines[j]] = [d.lines[j], d.lines[i]];
    if (dir < 0) node.parentNode.insertBefore(node, node.previousElementSibling); else node.parentNode.insertBefore(node.nextElementSibling, node);
    scheduleSave();
  };
  node.querySelector('.up').onclick = () => move(-1);
  node.querySelector('.dn').onclick = () => move(1);
  node.querySelector('.del').onclick = () => {
    const at = d.lines.indexOf(l), next = node.nextElementSibling, box = node.parentNode;
    d.lines = d.lines.filter(x => x.id !== l.id); node.remove();
    const wasLast = !d.lines.length; if (wasLast) $('#addLine').click();
    updateTotals(); scheduleSave();
    toast('Line removed', 5000, {label: 'Undo', fn: () => {
      if (current !== d) return;
      if (wasLast && d.lines.length === 1 && !d.lines[0].desc && !num(d.lines[0].qty) && !num(d.lines[0].price)) { d.lines = []; box.innerHTML = ''; }
      d.lines.splice(Math.min(at, d.lines.length), 0, l);
      if (next && next.parentNode === box) box.insertBefore(node, next); else box.appendChild(node);
      updateTotals(); scheduleSave();
    }});
  };
  if (isPct(l)) { node.querySelector('.pctin').oninput = e => { l.pct = e.target.value; updateTotals(); scheduleSave(); }; return; }
  l.laser = l.laser || {on: false, lmin: '', hmin: '', rate: settings.laborRate};
  const price = node.querySelector('.price'), q = s => node.querySelector(s);
  const adjRes = () => { q('.ares').textContent = num(l.adj) ? `${sgn(+num(l.adj))}% of ${money(lineBase(l))} = ${money(lineAdj(l))}` : 'Enter a percent: negative for a discount, positive for a premium.'; };
  const refresh = () => { q('.amt').textContent = money(lineAmount(l)); q('.tres').textContent = timeText(l); adjRes(); updateTotals(); scheduleSave(); };
  q('.qty').oninput = e => { l.qty = e.target.value; refresh(); };
  price.oninput = e => { l.price = e.target.value; refresh(); };
  ['lmin', 'hmin', 'rate'].forEach(k => q('.' + k).oninput = e => {
    l.laser[k] = e.target.value;
    if (num(l.laser.lmin) + num(l.laser.hmin) > 0 && num(l.laser.rate)) { l.price = timeUnit(l).toFixed(2); price.value = l.price; }
    refresh();
  });
  q('.timer').onclick = e => {
    l.laser.on = !l.laser.on;
    e.currentTarget.classList.toggle('on', l.laser.on); q('.timep').hidden = !l.laser.on;
    if (l.laser.on) { if (String(l.laser.rate ?? '') === '') { l.laser.rate = settings.laborRate; q('.rate').value = l.laser.rate; } q('.lmin').focus(); }
    refresh();
  };
  q('.adjin').oninput = e => { l.adj = e.target.value; refresh(); };
  q('.adjlbl').oninput = e => { l.adjLabel = e.target.value; scheduleSave(); };
  q('.adjbtn').onclick = e => {
    const open = q('.adjp').hidden;
    q('.adjp').hidden = !open; e.currentTarget.classList.toggle('on', open); l.adjOn = open;
    if (open) q('.adjin').focus(); else { l.adj = ''; l.adjLabel = ''; q('.adjin').value = ''; q('.adjlbl').value = ''; }
    refresh();
  };
  q('.tres').textContent = timeText(l); adjRes();
}
function wirePay(node) {
  const d = current, p = d.payments.find(x => x.id === node.dataset.id); if (!p) return;
  node.querySelector('.pdate').onchange = e => { p.date = e.target.value; scheduleSave(); };
  node.querySelector('.pmethod').onchange = e => { p.method = e.target.value; scheduleSave(); };
  node.querySelector('.pamt').oninput = e => { p.amount = e.target.value; updateTotals(); scheduleSave(); };
  node.querySelector('.pdel').onclick = () => { d.payments = d.payments.filter(x => x.id !== p.id); node.remove(); updateTotals(); scheduleSave(); };
}
function wireTax() {
  const d = current, locs = settings.taxLocations || [];
  const drawLoc = () => {
    const known = locs.some(l => l.name === d.taxLoc);
    $('#taxLoc').innerHTML = locs.map(l => `<option value="${esc(l.id)}" ${l.name === d.taxLoc ? 'selected' : ''}>${esc(l.name)} (${locRate(l)}%)</option>`).join('')
      + (!known ? `<option value="__this" selected>${esc(d.taxLoc || (locs.length ? 'Custom' : 'No saved locations'))}</option>` : '')
      + `<option value="__custom">Other / custom…</option>`;
  };
  const drawRows = () => { $('#taxRows').innerHTML = d.taxes.map(taxRowHtml).join(''); };
  drawLoc(); drawRows();
  $('#taxMode').onchange = e => {
    d.taxMode = e.target.value;
    $('#taxLocWrap').hidden = d.taxMode === 'none'; $('#exWrap').hidden = d.taxMode !== 'none';
    if (d.taxMode !== 'none' && !d.taxes.length) { const l = defaultLoc(); if (l) { applyLoc(d, l); drawLoc(); drawRows(); $('#taxShip').checked = d.taxShip; } }
    updateTotals(); scheduleSave();
  };
  $('#taxLoc').onchange = e => {
    const v = e.target.value;
    if (v === '__this') return;
    if (v === '__custom') { d.taxLoc = 'Custom'; d.taxes = [{id: uid('tx'), name: '', rate: ''}]; drawLoc(); drawRows(); $('#taxRows .txname').focus(); }
    else { applyLoc(d, locs.find(x => x.id === v)); drawRows(); }
    $('#taxShip').checked = !!d.taxShip;
    updateTotals(); scheduleSave();
  };
  $('#addTaxLine').onclick = () => { d.taxes.push({id: uid('tx'), name: '', rate: ''}); drawRows(); const n = $$('#taxRows .txname'); n[n.length - 1].focus(); scheduleSave(); };
  $('#taxRows').oninput = e => {
    const r = e.target.closest('.txrow'), x = r && d.taxes.find(t => t.id === r.dataset.id); if (!x) return;
    if (e.target.classList.contains('txname')) x.name = e.target.value; else x.rate = e.target.value;
    updateTotals(); scheduleSave();
  };
  $('#taxRows').onclick = e => {
    const b = e.target.closest('.txdel'); if (!b) return;
    d.taxes = d.taxes.filter(t => t.id !== b.closest('.txrow').dataset.id); drawRows(); updateTotals(); scheduleSave();
  };
  $('#exReason').onchange = e => { d.exReason = e.target.value; scheduleSave(); };
  $('#taxShip').onchange = e => { d.taxShip = e.target.checked; updateTotals(); scheduleSave(); };
}

function updateTotals() {
  const d = current, t = totals(d), box = $('#sum'); if (!box) return;
  $$('#lines .line').forEach(n => { const l = d.lines.find(x => x.id === n.dataset.id); if (l && isPct(l)) n.querySelector('.amt').textContent = money(lineAmount(l, d)); });
  let h = `<div><span>Subtotal${t.mode === 'included' ? ' (tax incl.)' : ''}</span><span>${money(t.sub)}</span></div>`
    + (t.disc ? `<div><span>Discount</span><span>${money(-t.disc)}</span></div>` : '')
    + (t.ship ? `<div><span>Shipping${t.shipTaxed ? ' (taxed)' : ''}</span><span>${money(t.ship)}</span></div>` : '');
  if (t.mode === 'added') h += t.taxRows.map(r => `<div><span>${esc(r.name)} (${esc(r.rate)}%)</span><span>${money(r.amt)}</span></div>`).join('') + (t.taxRows.length > 1 ? `<div><span>Total tax (${esc(t.taxRate)}%)</span><span>${money(t.tax)}</span></div>` : '') + (!t.taxRows.length ? `<div><span>Sales tax</span><span>no rate set</span></div>` : '');
  if (t.mode === 'none') h += `<div><span>Sales tax${d.exReason ? ' — ' + esc(d.exReason) : ''}</span><span>not charged</span></div>`;
  h += `<div class="grand"><span>Total</span><span>${money(t.total)}</span></div>`;
  if (t.mode === 'included') h += `<div class="incl"><span>Includes sales tax (${esc(t.taxRate)}%)</span><span>${money(t.tax)}</span></div>`;
  if (t.deposit) h += `<div class="bal"><span>Deposit to begin (${esc(+num(d.depositPct))}%)</span><span>${money(t.deposit)}</span></div>`;
  if (isInv(d)) $('#dueShow').value = num(d.dueDays) > 0 ? fmtDate(dueISO(d)) : 'On receipt';
  if (isInv(d) && $('#paysum')) {
    if (t.paid) h += `<div><span>Paid</span><span>${money(-t.paid)}</span></div>`;
    const full = t.total > 0 && t.balance <= 0;
    h += `<div class="bal ${full ? 'paid' : ''}"><span>${full ? 'Paid in full' : 'Balance due'}</span><span>${money(Math.max(t.balance, 0))}</span></div>`;
    const st = status(d);
    $('#paysum').innerHTML = `<span>Paid <b>${money(t.paid)}</b> of <b>${money(t.total)}</b></span><span class="chip ${st}">${st}</span>`;
  }
  if (isInv(d)) {
    if ($('#aDel')) $('#aDel').textContent = mustVoid(d) ? 'Void' : 'Delete';
  }
  box.innerHTML = h;
}

async function makeInvoice() {
  const q = current;
  await flushSave();
  const inv = newDoc('invoice');
  Object.assign(inv, {
    customer: clone(q.customer), lines: clone(q.lines).map(l => Object.assign(l, {id: uid('l')})),
    discount: q.discount, discType: q.discType, shipping: q.shipping,
    taxMode: q.taxMode, taxLoc: q.taxLoc, taxes: clone(q.taxes || []), taxShip: !!q.taxShip, exReason: q.exReason || '',
    fromQuote: {id: q.id, number: q.number},
  });
  inv.number = nextNumber('invoice', q);
  q.status = 'Invoiced'; q.invoiceRef = {id: inv.id, number: inv.number};
  try { await commit(q); await commit(inv); } catch (e) { toast('Could not create the invoice — try again.'); return; }
  current = null; await go('edit', inv);
  toast(`Invoice ${inv.number} created from ${q.number}`);
}
async function duplicate() {
  await flushSave();
  const d = clone(current), n = newDoc(d.docType || 'quote');
  Object.assign(d, {id: n.id, number: n.number, date: n.date, createdAt: Date.now(), updatedAt: Date.now()});
  delete d.invoiceRef; delete d.fromQuote; delete d.void;
  if (isInv(d)) { d.payments = []; d.recorded = false; } else d.status = 'Draft';
  d.lines.forEach(l => l.id = uid('l'));
  current = null; await go('edit', d); flushSave(); toast('Copied to ' + d.number);
}
async function deleteCurrent() {
  const d = current;
  if (!(await ask(`Delete ${isInv(d) ? 'invoice' : 'quote'} ${d.number}? This can't be undone. The number stays on record as deleted, so it won't be reused.`, 'Delete'))) return;
  clearTimeout(saveTimer); saveTimer = null; current = null;
  docs = docs.filter(x => x.id !== d.id);
  try {
    await saving; await leaveMarker(d, 'Deleted'); await store.remove(d.id);
    const otherId = isInv(d) ? d.fromQuote && d.fromQuote.id : d.invoiceRef && d.invoiceRef.id;
    const other = otherId && docs.find(x => x.id === otherId);
    if (other) {
      const o = clone(other);
      if (isInv(d)) { delete o.invoiceRef; if (o.status === 'Invoiced') o.status = 'Accepted'; } else delete o.fromQuote;
      await commit(o);
    }
  } catch (e) { toast('Could not delete — try again.'); }
  go('list');
}
async function voidCurrent() {
  const d = current;
  if (!(await ask(`Void invoice ${d.number}? ${hasPayments(d) ? 'It has payments recorded, so it' : 'Your numbering keeps invoices gap-free, so it'} stays in your records marked VOID and is left out of totals. You can restore it later.`, 'Void'))) return;
  d.void = true; await flushSave(); await commit(d); renderEdit(); toast('Invoice voided');
}

  $('#actions').innerHTML = `<div class="actions"><button class="btn" id="sBack">← ${docs.length ? 'Back to quotes' : 'Back to start'}</button><button class="btn primary" id="sSave">Save settings</button></div>`;

    const l = locOf(e.target); if (!l) return;

    const r = e.target.closest('.txrow'), x = r && l.lines.find(t => t.id === r.dataset.id); if (!x) return;

  $('#locList').addEventListener('change', e => { if (e.target.classList.contains('ldef')) defLoc = locOf(e.target).id; if (e.target.classList.contains('lship')) locOf(e.target).taxShip = e.target.checked; });
  $('#locList').addEventListener('click', async e => {
    const l = locOf(e.target); if (!l) return;

    else if (e.target.closest('.txdel')) { const id = e.target.closest('.txrow').dataset.id; l.lines = l.lines.filter(t => t.id !== id); drawLocs(); }

  $('#addLoc').onclick = () => { const l = {id: uid('loc'), name: '', lines: [{id: uid('tx'), name: 'Sales tax', rate: ''}]}; locs.push(l); if (!defLoc) defLoc = l.id; drawLocs(); const n = $$('#locList .lname'); n[n.length - 1].focus(); };

  // products & services (stored as "items")

  };
  const paramsHtml = it => {

  const itemHtml = it => `<div class="item" data-id="${esc(it.id)}">
    <div class="ihead"><input class="iname" value="${esc(it.name)}" placeholder="Name — shows in the dropdown"><select class="itype">${ITEM_TYPES.map(([k, l]) => `<option value="${k}" ${k === it.type ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="ibtn idel" title="Delete item">×</button></div>

  $('#itemList').addEventListener('input', e => {

  });
  $('#itemList').addEventListener('change', e => {
    if (!e.target.classList.contains('itype')) return;

  });
  $('#itemList').addEventListener('click', async e => {
    const it = itemOf(e.target); if (!it || !e.target.closest('.idel')) return;

  });
  $('#addItemDef').onclick = () => { items.push({id: uid('it'), name: '', desc: '', type: 'each', price: '', unit: ''}); renderItems(); const all = $$('#itemList .iname'); all[all.length - 1].focus(); };
  $('#addExamples').onclick = () => { items.push(...exampleItems()); renderItems(); toast('Examples added — change the prices to yours, then Save settings', 3500); };

  // payment QR preview
  const drawQr = () => {
    const link = $('#sPayLink').value.trim(), box = $('#qrPrev'), m = link && qrMatrix(link);
    if (!m) { box.textContent = link ? 'Link too long' : 'QR preview'; return; }
    const n = m.length;
    box.innerHTML = `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" width="92" height="92" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/>${m.map((row, r) => row.map((on, c) => on ? `<rect x="${c}" y="${r}" width="1" height="1"/>` : '').join('')).join('')}</svg>`;
  };
  const SNP_URL = 'https://scannpay.me/intro?utm_source=quickquote&utm_medium=app&utm_campaign=settings';
  const drawSnp = () => {
    const isSnp = /scannpay\.me/i.test($('#sPayLink').value);
    $('#snpNote').innerHTML = isSnp
      ? '✓ Scan-n-Pay link — customers scan one QR code and choose any way you take payment.'
      : `Paste any one payment link above — PayPal, Venmo, Cash App, Stripe… — and it prints as a QR code on unpaid invoices. <b>Take more than one?</b> <a href="${SNP_URL}" target="_blank" rel="noopener">Scan-n-Pay</a> — a separate app from the makers of Quick Quote — puts them all behind a single QR code, so customers pick how they want to pay. It's optional; any link works here.`;
  };
  drawQr(); drawSnp(); $('#sPayLink').oninput = () => { drawQr(); drawSnp(); };

  // look
  const setAccent = c => { accent = c; $$('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === c)); $('#accentPick').value = c; const r = document.documentElement.style; r.setProperty('--accent', c); r.setProperty('--accent-d', mix(c, '#000000', .2)); r.setProperty('--accent-l', mix(c, '#ffffff', .9)); };
  $$('.sw').forEach(b => b.onclick = () => setAccent(b.dataset.c));
  $('#accentPick').oninput = e => setAccent(e.target.value);
  $('#logoIn').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const fit = max => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv; };
        let cv = fit(600), src = cv.toDataURL('image/png');
        if (src.length > 170000) { cv = fit(400); src = cv.toDataURL('image/png'); }
        if (src.length > 170000) { const bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height; const b = bg.getContext('2d'); b.fillStyle = '#fff'; b.fillRect(0, 0, bg.width, bg.height); b.drawImage(cv, 0, 0); cv = bg; src = bg.toDataURL('image/jpeg', 0.85); }
        logo = {src, w: cv.width, h: cv.height};
        $('#logoPrev').innerHTML = `<img src="${src}" alt="Logo">`; $('#logoRm').disabled = false;
      };
      img.onerror = () => toast('That image could not be read.');
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  $('#logoRm').onclick = () => { logo = {src: '', w: 0, h: 0}; $('#logoPrev').textContent = 'No logo'; $('#logoRm').disabled = true; };

  // exports
  const setRange = () => {
    const v = $('#exRange').value, t = todayISO(), [y, m] = t.split('-').map(Number);
    const first = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
    if (v === 'last') { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; $('#exFrom').value = first(py, pm); $('#exTo').value = addDays(first(y, m), -1); }
    else if (v === 'this') { $('#exFrom').value = first(y, m); $('#exTo').value = t; }
    else if (v === 'year') { $('#exFrom').value = `${y}-01-01`; $('#exTo').value = t; }
    else if (v === 'all') { $('#exFrom').value = ''; $('#exTo').value = ''; }
  };
  setRange();
  $('#exRange').onchange = setRange;
  ['exFrom', 'exTo'].forEach(id => $('#' + id).onchange = () => { $('#exRange').value = 'custom'; });
  $('#exInv').onclick = () => exportCsv('invoices', $('#exFrom').value, $('#exTo').value);
  $('#exTax').onclick = () => exportCsv('tax', $('#exFrom').value, $('#exTo').value, $('#exGroup').value);
  $('#exReg').onclick = () => exportCsv('register');
  $('#exSales').onclick = () => exportCsv('sales', $('#exFrom').value, $('#exTo').value, $('#exGroup').value);
  $('#clGo').onclick = () => cleanupFlow(+$('#clYears').value);
  $('#bkDl').onclick = downloadBackup;
  $('#bkIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); };

  // numbering preview
  const drawNum = () => {
    const style = $('#sNumStyle').value, linked = style !== 'date', qp = $('#sQPre').value.trim(), ip = $('#sIPre').value.trim(), n = Math.max(1, num($('#sStart').value) || 1001);
    const yr = $('#sYear').checked && linked, yy = todayISO().slice(2, 4) + '-';
    $('#sYearWrap').hidden = !linked; $('#sStartWrap').hidden = !linked || yr;
    if (yr && qp === ip) { $('#numPreview').className = 'note warn'; $('#numPreview').textContent = 'Quotes and invoices need different prefixes — e.g. "Q-" for quotes and none for invoices.'; return; }
    if (yr) { const pv = $('#numPreview'); pv.className = 'note'; pv.textContent = style === 'separate'
      ? `Quotes count ${qp}${yy}001, ${qp}${yy}002… and invoices count ${ip}${yy}001, ${ip}${yy}002… on their own, with no gaps. On January 1 both start again at 001 with the new year. In this style invoices can only be voided, never deleted.`
      : `Next quote: ${qp}${yy}001, and when it becomes an invoice: ${ip}${yy}001. On January 1 numbers start again at 001 with the new year, by your device's date. A quote from last year keeps its number when you invoice it.`; return; }
    const pv = $('#numPreview');
    if (linked && qp === ip) { pv.className = 'note warn'; pv.textContent = 'Quotes and invoices need different prefixes in this style — e.g. "Q-" for quotes and none for invoices.'; return; }
    pv.className = 'note';
    pv.textContent = style === 'separate'
      ? `Quotes count ${qp}${n}, ${qp}${n + 1}… and invoices count ${ip}${n}, ${ip}${n + 1}… on their own, with no gaps — each invoice shows which quote it came from. In this style invoices can only be voided, never deleted.`
      : linked
      ? `Next quote: ${qp}${n}, and when it becomes an invoice: ${ip}${n}. Invoices made without a quote take the next number, so declined quotes leave gaps in your invoice numbers — normal for most small businesses. (Already-used numbers are skipped.)`
      : `Next quote: ${qp}${todayISO().slice(2).replace(/-/g, '')}-01 · next invoice: ${ip || 'INV-'}${todayISO().slice(2).replace(/-/g, '')}-01. Numbers restart each day.`;
  };
  ['sNumStyle', 'sQPre', 'sIPre', 'sStart'].forEach(id => $('#' + id).addEventListener('input', drawNum));
  $('#sYear').addEventListener('change', drawNum);
  $('#sNumStyle').addEventListener('change', drawNum); drawNum();

  $('#sSave').onclick = async () => {
    if ($('#sNumStyle').value !== 'date' && $('#sQPre').value.trim() === $('#sIPre').value.trim()) { toast('Give quotes and invoices different number prefixes.', 3500); $('#sQPre').focus(); return false; }
    const next = Object.assign({}, settings, {
      setupDone: true,
      bizName: $('#sBiz').value.trim(), showName: $('#sShowName').checked, tagline: $('#sTag').value.trim(), taxId: $('#sTaxId').value.trim(),
      contact: $('#sContact').value.trim(), footerNote: $('#sFoot').value.trim(), currency: $('#sCur').value.trim() || '$',
      logo: logo.src, logoW: logo.w, logoH: logo.h, accent,
      laborRate: $('#sRate').value.trim() === '' ? '' : num($('#sRate').value),
      items: items.filter(it => (it.name || '').trim()).map(it => Object.assign(it, {name: it.name.trim()})),
      taxDefaultMode: $('#sTaxMode').value, taxAnswered: true,
      taxLocations: locs.map(l => ({id: l.id, name: (l.name || '').trim() || 'Location', taxShip: !!l.taxShip, lines: l.lines.filter(x => (x.name || '').trim() || num(x.rate)).map(x => ({id: x.id, name: (x.name || '').trim() || 'Sales tax', rate: String(num(x.rate))}))})),
      defaultLoc: defLoc,
      numberStyle: $('#sNumStyle').value, yearPrefix: $('#sYear').checked, startNumber: Math.max(1, num($('#sStart').value) || 1001),
      quotePrefix: $('#sQPre').value.trim(), validDays: Math.max(0, num($('#sValid').value)), depositPct: $('#sDep').value.trim() === '' ? '' : Math.min(100, Math.max(0, num($('#sDep').value))),
      terms: $('#sTerms').value, acceptLine: $('#sAccept').checked,
      invoicePrefix: $('#sIPre').value.trim() || ($('#sNumStyle').value === 'date' ? 'INV-' : ''), dueDays: Math.max(0, num($('#sDue').value)), invoiceTerms: $('#sITerms').value,
      trackPayments: $('#sTrack').checked, payMethods: $('#sMethods').value, payInstructions: $('#sPayInst').value, payLink: $('#sPayLink').value.trim(),
    });
    normSettings(next);
    const ok = await saveSettingsNow(next);
    if (ok) toast('Settings saved');
    return ok;
  };
}

// ───────── first-run setup
function renderSetup() {
  const home = defaultLoc();
  let lines = home && home.lines.length ? clone(home.lines) : [{id: uid('tx'), name: 'Sales tax', rate: ''}];
  const preMode = home ? (settings.taxDefaultMode === 'included' ? 'included' : 'added') : settings.taxAnswered && settings.taxDefaultMode === 'none' ? 'none' : 'added';
  $('#app').innerHTML = `

      <label class="f">Business name<input id="wBiz" value="${esc(settings.bizName)}" placeholder="Your business"></label>

      <label class="f" style="max-width:160px">Currency symbol<input id="wCur" value="${esc(settings.currency || '$')}"></label>
    </div>
  </div>
  <div class="card"><h2>Sales tax</h2>
    <label class="f">Do you collect sales tax?<select id="wTax">${[['added', 'Yes — I add it on top of my prices'], ['included', 'Yes — my prices already include it'], ['none', 'No']].map(([k, l]) => `<option value="${k}" ${k === preMode ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <div id="wTaxWrap" style="margin-top:10px" ${preMode === 'none' ? 'hidden' : ''}>
      <label class="f">Where you usually sell<input id="wLoc" value="${esc(home ? home.name : '')}" placeholder="e.g. your town or county"></label>
      <div id="wRows"></div>
      <button class="tbtn" id="wAdd" style="margin-top:8px">+ Tax line</button>
      <p class="note">Enter your total rate as one line, or split it into pieces — e.g. <i>State 4%</i> and <i>County 1.5%</i> — so your PDFs itemize it. This becomes your <b>home location</b>. Sell in other towns with different rates, like shows or fairs? You can add those later in <b>Settings → Sales tax</b>, which has a step-by-step example to follow. Your state's tax office lists current rates.</p>
    </div>
  </div>`;
  $('#actions').innerHTML = `<div class="actions"><button class="btn" id="wSkip">Skip for now</button><button class="btn primary" id="wGo">Start</button></div>`;
  const draw = () => { $('#wRows').innerHTML = lines.map(taxRowHtml).join(''); };
  draw();
  $('#wTax').onchange = e => { $('#wTaxWrap').hidden = e.target.value === 'none'; };
  $('#wAdd').onclick = () => { lines.push({id: uid('tx'), name: '', rate: ''}); draw(); const n = $$('#wRows .txname'); n[n.length - 1].focus(); };
  $('#wRows').oninput = e => { const r = e.target.closest('.txrow'), x = r && lines.find(t => t.id === r.dataset.id); if (!x) return; if (e.target.classList.contains('txname')) x.name = e.target.value; else x.rate = e.target.value; };
  $('#wRows').onclick = e => { const b = e.target.closest('.txdel'); if (!b) return; lines = lines.filter(t => t.id !== b.closest('.txrow').dataset.id); draw(); };
  const finish = async skip => {
    const next = Object.assign({}, settings, {setupDone: true});
    if (!skip) {
      const mode = $('#wTax').value, good = lines.filter(x => num(x.rate));
      Object.assign(next, {bizName: $('#wBiz').value.trim(), contact: $('#wContact').value.trim(), currency: $('#wCur').value.trim() || '$', taxDefaultMode: good.length ? mode : 'none', taxAnswered: mode === 'none' || good.length > 0});
      if (mode !== 'none' && good.length) {   // update the home location (keeping any others), or create it
        const loc = {id: home ? home.id : uid('loc'), name: $('#wLoc').value.trim() || 'Home', taxShip: !!(home && home.taxShip), lines: good.map(x => ({id: x.id, name: (x.name || '').trim() || 'Sales tax', rate: String(num(x.rate))}))};
        next.taxLocations = home ? (settings.taxLocations || []).map(l => l.id === home.id ? loc : l) : [loc]; next.defaultLoc = loc.id;
      }
    }

    series.forEach(ps => {
      const pats = ps.map(p => new RegExp('^' + reEsc(p) + '(\\d+)$')), used = new Set();
      recs.forEach(r => pats.forEach(re => { const m = re.exec((r.n || '').trim()); if (m) used.add(+m[1]); }));
      if (used.size < 2) return;
      const lo = Math.min(...used), hi = Math.max(...used);
      for (let i = lo; i <= hi && skipped.length < 5000; i++) if (!used.has(i)) skipped.push({n: (style === 'separate' ? ps[0] : yearOn() ? ps[ps.length - 1] : '') + padN(i), type: style === 'separate' ? (ps[0].startsWith(settings.invoicePrefix || '') && !(settings.quotePrefix && ps[0].startsWith(settings.quotePrefix)) ? 'Invoice' : 'Quote') : '', date: '', fate: 'Not used (number skipped)', link: '', who: ''});
    });
    const all = recs.concat(skipped).sort((a, b) => key(a.n) - key(b.n) || (a.type === 'Quote' ? -1 : 1));
    rows = [['Number', 'Type', 'Date', 'What happened', 'Linked to', 'Customer']].concat(all.map(r => [r.n, r.type, r.date, r.fate, r.link, r.who]));
    if (rows.length === 1) rows.push(['', '', '', 'Nothing issued yet']);
    name = `number_register_${todayISO()}.csv`;
  } else if (kind === 'sales') {
    const g = new Map();
    invs.filter(d => !d.void).forEach(d => {
      const t = totals(d), k = periodOf(d.date, by);
      if (!g.has(k)) g.set(k, {n: 0, net: 0, taxable: 0, exempt: 0, tax: 0, ship: 0, total: 0});
      const e = g.get(k); e.n++; e.net += t.net; e.tax += t.tax; e.ship += t.ship; e.total += t.total;
      if (t.mode === 'none') e.exempt += t.net; else e.taxable += t.taxable;
    });
    rows = [[by === 'week' ? 'Week' : 'Month', 'Invoices', 'Sales (excl. tax)', 'Taxable sales', 'Non-taxable sales', 'Sales tax', 'Shipping', 'Total invoiced']];
    const all = {n: 0, net: 0, taxable: 0, exempt: 0, tax: 0, ship: 0, total: 0};
    [...g].sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, e]) => { rows.push([k, e.n, n2(e.net), n2(e.taxable), n2(e.exempt), n2(e.tax), n2(e.ship), n2(e.total)]); Object.keys(all).forEach(x => all[x] += e[x]); });
    if (rows.length === 1) rows.push(['', 'No invoices in this period']);
    else rows.push(['TOTAL', all.n, n2(all.net), n2(all.taxable), n2(all.exempt), n2(all.tax), n2(all.ship), n2(all.total)]);
    name = `sales_summary_by_${by}_${span}.csv`;
  } else {
    const g = new Map();
    invs.filter(d => !d.void).forEach(d => {
      const t = totals(d), month = periodOf(d.date, by), loc = t.mode === 'none' ? `Not taxable${d.exReason ? ' — ' + d.exReason : ''}` : (d.taxLoc || 'No location');
      const k = month + '|' + loc;
      if (!g.has(k)) g.set(k, {month, loc, n: 0, taxable: 0, exempt: 0, ship: 0, tax: 0, rate: t.taxRate, parts: new Map()});
      const e = g.get(k); e.n++; e.ship += t.ship;
      if (t.mode === 'none') e.exempt += t.net; else { e.taxable += t.taxable; e.tax += t.tax; t.taxRows.forEach(r => { const pk = `${r.name} (${r.rate}%)`; e.parts.set(pk, (e.parts.get(pk) || 0) + r.amt); }); }
    });
    rows = [[by === 'week' ? 'Week' : 'Month', 'Location', 'Invoices', 'Taxable sales (excl. tax)', 'Non-taxable sales', 'Shipping (total)', 'Sales tax', 'Tax breakdown']];
    [...g.values()].sort((a, b) => a.month.localeCompare(b.month) || a.loc.localeCompare(b.loc)).forEach(e =>
      rows.push([e.month, e.loc, e.n, n2(e.taxable), n2(e.exempt), n2(e.ship), n2(e.tax), [...e.parts].map(([k, v]) => `${k}: ${n2(v)}`).join('; ')]));
    if (rows.length === 1) rows.push(['', 'No invoices in this period']);
    name = `sales_tax_summary_by_${by}_${span}.csv`;
  }
  try { await downloads.save({filename: name, data: csv(rows)}); toast('Saved ' + name); return true; }
  catch (e) { if (!(e && e.code === 'declined')) toast('Could not save the file.'); return false; }
}

// ───────── backup & restore
async function downloadBackup() {
  if (!downloads) return toast('Downloads work when this page is opened in Claude.');
  await flushSave();
  const data = JSON.stringify({app: 'quick-quote', version: 1, exportedAt: new Date().toISOString(), settings, docs, gone}, null, 1);
  try { await downloads.save({filename: `quick-quote-backup-${todayISO()}.json`, data}); toast('Backup saved'); }
  catch (e) { if (!(e && e.code === 'declined')) toast('Could not save the backup.'); }
}
async function restoreBackup(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch (e) { return toast('That file is not a Quick Quote backup.', 3000); }
  if (!b || b.app !== 'quick-quote' || !Array.isArray(b.docs)) return toast('That file is not a Quick Quote backup.', 3000);
  const incoming = b.docs.filter(d => d && d.kind === 'quote' && typeof d.id === 'string' && /^[\w.~:@+-]{1,120}$/.test(d.id) && Array.isArray(d.lines) && d.customer);
  const when = b.exportedAt ? fmtDate(b.exportedAt.slice(0, 10)) : 'an unknown date';
  const mode = await choose(`Backup from ${when}: ${incoming.length} quote${incoming.length === 1 ? '' : 's'} & invoice${incoming.length === 1 ? '' : 's'}.\n\nMerge adds anything missing and updates older copies — your current settings stay.\nReplace makes the app match the backup exactly, settings included.`,
    [{label: 'Cancel', value: null}, {label: 'Replace…', value: 'replace', cls: 'danger'}, {label: 'Merge', value: 'merge', cls: 'primary'}]);
  if (!mode) return;
  if (mode === 'replace' && !(await ask(`Replace everything with the backup? Quotes and invoices that aren't in the backup (${docs.filter(d => !incoming.some(x => x.id === d.id)).length}) will be removed. Download a backup of what you have now first if you're unsure.`, 'Replace'))) return;
  await flushSave();
  const have = new Map(docs.map(d => [d.id, d]));
  const toSave = mode === 'replace' ? incoming : incoming.filter(d => !have.has(d.id) || (d.updatedAt || 0) > (have.get(d.id).updatedAt || 0));
  const toRemove = mode === 'replace' ? docs.filter(d => !incoming.some(x => x.id === d.id)).map(d => d.id) : [];
  try {
    for (let i = 0; i < toSave.length; i += 10) await Promise.all(toSave.slice(i, i + 10).map(d => store.save(clone(d))));
    for (let i = 0; i < toRemove.length; i += 10) await Promise.all(toRemove.slice(i, i + 10).map(id => store.remove(id)));
    if (mode === 'replace' && b.settings) { const ns = normSettings(Object.assign(defaultSettings(), b.settings, {setupDone: true})); ns.updatedAt = Date.now(); await store.saveSettings(ns); settings = ns; }
    const gIn = (Array.isArray(b.gone) ? b.gone : []).filter(g => g && g.kind === 'gone' && typeof g.id === 'string' && /^[\w.~:@+-]{1,130}$/.test(g.id) && !gone.some(x => x.id === g.id));
    for (const g of gIn) await store.saveGone(g);
    docs = await store.list(); docs.forEach(d => { if (!d.docType) d.docType = 'quote'; normTax(d); });
    gone = await store.listGone();
    applyTheme(); settingsDirty = false;
    toast(mode === 'replace' ? 'Restored from backup' : `Merged: ${toSave.length} added or updated`, 3000);
    go('list');
  } catch (e) { toast('Restore stopped partway — try again.', 3500); }
}

// ───────── cleanup (manual only — never automatic)
async function cleanupFlow(years) {
  const [y, m, dd] = todayISO().split('-'), cutoff = `${+y - years}-${m}-${dd}`;
  const openInv = d => isInv(d) && !d.void && settings.trackPayments && totals(d).balance > 0;
  const old = docs.filter(d => (d.date || '') < cutoff);
  const cands = old.filter(d => !openInv(d)), kept = old.length - cands.length;
  if (!cands.length) return toast(`Nothing dated before ${fmtDate(cutoff)} to clean up.`, 3000);
  const nq = cands.filter(d => !isInv(d)).length, ni = cands.length - nq;
  const r = await choose(`${nq} quote${nq === 1 ? '' : 's'} and ${ni} invoice${ni === 1 ? '' : 's'} are dated before ${fmtDate(cutoff)}.${kept ? ` ${kept} unpaid invoice${kept === 1 ? '' : 's'} from then will be kept.` : ''} First, download a copy of those invoices for your records.`,
    [{label: 'Cancel', value: null}, {label: 'Download CSV', value: 'dl', cls: 'primary'}]);
  if (r !== 'dl') return;
  if (!(await exportCsv('invoices', '', addDays(cutoff, -1)))) return toast('Cleanup stopped — the copy was not saved.', 3000);
  if (!(await ask(`Copy saved. Permanently remove these ${cands.length} items from the app?`, 'Remove'))) return;
  const ids = new Set(cands.map(d => d.id));
  try {
    const list = [...ids];
    for (let i = 0; i < list.length; i += 10) await Promise.all(list.slice(i, i + 10).map(async id => { const d = docs.find(x => x.id === id); if (d) await leaveMarker(d, 'Removed in cleanup'); await store.remove(id); }));
    docs = docs.filter(d => !ids.has(d.id));
    toast(`Removed ${ids.size} old item${ids.size === 1 ? '' : 's'}.`);
  } catch (e) { toast('Some items could not be removed — try again.'); }
  const c = $('#clCount'); if (c) c.textContent = `You have ${docs.length.toLocaleString()} quote${docs.length === 1 ? '' : 's'} & invoice${docs.length === 1 ? '' : 's'} saved.`;
}

// ───────── boot
['input', 'change'].forEach(ev => $('#app').addEventListener(ev, e => { if (view === 'settings' && !e.target.closest('#dataCard')) settingsDirty = true; }));
$('#app').addEventListener('click', e => { if (view === 'settings' && e.target.closest('.sw,#logoRm,.idel,.ldel,.laddl,.txdel,#addLoc,#addItemDef,#addExamples')) settingsDirty = true; });
$('#navList').onclick = () => go('list');
$('#navSettings').onclick = () => go('settings');
$('#navNew').onclick = async () => {
  const t = await choose('Start a new…', [{label: 'Cancel', value: null}, {label: 'Invoice', value: 'invoice', cls: 'dark'}, {label: 'Quote', value: 'quote', cls: 'primary'}]);
  if (t) go('edit', newDoc(t));
};
async function boot() {
  let db = null, userId = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const [d, u, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
      db = d; downloads = dl; if (u) userId = await u.id();
    }
  } catch (e) {}
  store = db && userId ? dbStore(db, userId) : localStore();
  let stored = null;
  try { stored = await store.getSettings(); docs = await store.list(); gone = await store.listGone(); }
  catch (e) {
    store = localStore();
    banner = "Can't reach your saved quotes right now — anything you make is kept in this browser until the connection comes back.";
    stored = await store.getSettings(); docs = await store.list(); gone = await store.listGone();
  }
  if (store.kind === 'local' && !banner) banner = 'Saving on this device only — your quotes stay in this browser and won\'t show up on your other devices. Download a backup now and then (Settings → Your data). Saving to your Claude account needs a paid Claude plan with this app\'s permissions switched on.';
  settings = normSettings(Object.assign(defaultSettings(), stored ? {} : starterSettings(), stored || {}));
  if (stored && stored.setupDone === undefined) settings.setupDone = true;   // people who used earlier versions skip the welcome screen
  docs.forEach(d => { if (!d.docType) d.docType = 'quote'; normTax(d); });
  applyTheme();
  await recoverDraft();
  go(settings.setupDone ? 'list' : 'setup');
  if (store.kind === 'db') offerOfflineItems();
}
async function recoverDraft() {
  let x = null; try { x = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
  if (!x || !x.doc || typeof x.doc.id !== 'string') return;
  const mine = docs.find(d => d.id === x.doc.id);
  if (mine && (mine.updatedAt || 0) >= x.at) { dropDraft(x.doc.id); return; }   // the saved copy is already newer
  if (gone.some(g => g.id === 'g-' + x.doc.id)) { dropDraft(x.doc.id); return; }   // it was deleted on purpose
  try { normTax(x.doc); await commit(x.doc); dropDraft(x.doc.id); setTimeout(() => toast(`Recovered unsaved changes to ${x.doc.number || 'a quote'}`, 4000), 300); } catch (e) {}
}
async function offerOfflineItems() {   // items made while the account couldn't be reached live only in this browser
  let local = []; try { local = (await localStore().list()).filter(d => d && d.id && !docs.some(x => x.id === d.id)); } catch (e) {}
  if (!local.length) return;
  const r = await choose(`${local.length === 1 ? 'A quote or invoice was' : local.length + ' quotes or invoices were'} saved only on this device while your account couldn't be reached. Move ${local.length === 1 ? 'it' : 'them'} into your account?`,
    [{label: 'Not now', value: null}, {label: 'Move into my account', value: 'move', cls: 'primary'}]);
  if (r !== 'move') return;
  const ls = localStore();
  try {
    for (const d of local) { normTax(d); if (!d.docType) d.docType = 'quote'; await commit(d); await ls.remove(d.id); }
    toast(`Moved ${local.length} item${local.length === 1 ? '' : 's'} into your account`); if (view === 'list') renderList();
  } catch (e) { toast('Could not move them just now — try again later.'); }
}
window.addEventListener('pagehide', () => { if (saveTimer) flushSave(); });
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { if (saveTimer) flushSave(); return; }
  if (!store) return;
  try {
    const fresh = await withTimeout(store.list(), 8000);
    fresh.forEach(d => { if (!d.docType) d.docType = 'quote'; normTax(d); });
    docs = fresh;
    if (view === 'list') renderList();
    if (view === 'edit' && current) { const theirs = docs.find(x => x.id === current.id); if (theirs && (theirs.updatedAt || 0) > (current.updatedAt || 0) + 1000 && !saveTimer) toast('This was changed on another device — reopen it to see the latest.', 4000); }
  } catch (e) {}
});
boot();
</script>
